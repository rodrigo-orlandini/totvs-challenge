server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: casecellshop
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["totvs-app-1", "app"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: container
      - replacement: casecellshop
        target_label: app
    pipeline_stages:
      - json:
          expressions:
            traceId: traceId
            level: level
      - labels:
          level:
      - structured_metadata:
          traceId:
