server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: casecellshop
    static_configs:
      - targets:
          - localhost
        labels:
          app: casecellshop
          __path__: /var/log/casecellshop/*.log
    pipeline_stages:
      - json:
          expressions:
            traceId: traceId
            level: level
      - labels:
          traceId:
          level:
